<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>茄子管家·终极版</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    :root {
      --primary: #5B6ABF; --primary-light: #7B8CDE; --bg: #F0F2F8; --card-bg: #FFFFFF;
      --text: #1A1A2E; --text-secondary: #6B7280; --border: #E5E7EB;
      --shadow: 0 2px 12px rgba(91,106,191,0.08); --radius: 16px;
      --success: #22C55E; --warning: #F59E0B; --danger: #EF4444; --gentle: #EC4899;
    }
    body { background:var(--bg); padding:12px; padding-bottom:80px; color:var(--text); }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:0 4px; }
    .header h1 { font-size:22px; font-weight:700; color:var(--primary); }
    .header h1 span { color:var(--text); }
    .voice-btn { background:var(--primary); color:white; border:none; width:48px; height:48px; border-radius:50%; font-size:20px; box-shadow:0 4px 16px rgba(91,106,191,0.35); cursor:pointer; }
    .voice-btn:active { transform:scale(0.92); }
    .scene-tips { background:var(--card-bg); border-radius:var(--radius); padding:14px 18px; margin-bottom:16px; box-shadow:var(--shadow); border-left:4px solid var(--primary); font-size:14px; color:var(--text-secondary); }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .card { background:var(--card-bg); border-radius:var(--radius); padding:14px 4px; text-align:center; box-shadow:var(--shadow); cursor:pointer; transition:0.15s; border:1px solid transparent; }
    .card:active { transform:scale(0.94); background:#f5f6fa; border-color:var(--primary-light); }
    .card .icon { font-size:26px; margin-bottom:2px; }
    .card .name { font-size:10px; color:var(--text-secondary); font-weight:500; }
    .detail-page { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:100; overflow-y:auto; padding:12px; }
    .detail-page.active { display:block; }
    .back-btn { background:none; border:none; font-size:26px; cursor:pointer; margin-bottom:6px; color:var(--text); display:flex; align-items:center; gap:6px; }
    .back-btn span { font-size:15px; font-weight:500; }
    .dashboard { background:var(--card-bg); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
    .dash-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
    .dash-item { text-align:center; background:#f8f9fc; border-radius:12px; padding:10px 4px; }
    .dash-item .num { font-size:20px; font-weight:700; color:var(--primary); }
    .dash-item .label { font-size:11px; color:var(--text-secondary); margin-top:2px; }
    .view-tabs { display:flex; gap:6px; margin-bottom:12px; background:var(--card-bg); border-radius:12px; padding:4px; box-shadow:var(--shadow); }
    .view-tab { flex:1; text-align:center; padding:8px 0; border-radius:8px; font-size:13px; font-weight:500; color:var(--text-secondary); cursor:pointer; }
    .view-tab.active { background:var(--primary); color:white; }
    .list-wrapper { overflow:hidden; border-radius:12px; margin-bottom:6px; background:var(--card-bg); box-shadow:var(--shadow); position:relative; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--card-bg); cursor:pointer; position:relative; z-index:2; }
    .list-item .main { display:flex; flex-direction:column; gap:2px; flex:1; }
    .list-item .main .title { font-size:14px; color:var(--text); font-weight:500; }
    .list-item .main .sub { font-size:11px; color:var(--text-secondary); }
    .list-item .right { text-align:right; min-width:60px; }
    .list-item .right .amount { font-weight:700; font-size:15px; }
    .list-item .right .amount.expense { color:var(--danger); }
    .list-item .right .amount.income { color:var(--success); }
    .list-item .right .date { font-size:10px; color:var(--text-secondary); }
    .list-actions { position:absolute; top:0; right:-120px; width:120px; height:100%; display:flex; border-radius:12px; transition:0.25s; }
    .list-actions .action-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-size:11px; background:transparent; border:none; cursor:pointer; }
    .list-actions .action-btn.edit { background:#3B82F6; }
    .list-actions .action-btn.delete { background:var(--danger); }
    .add-btn { position:fixed; bottom:24px; right:24px; background:var(--primary); color:white; border:none; width:58px; height:58px; border-radius:50%; font-size:26px; box-shadow:0 4px 20px rgba(91,106,191,0.4); cursor:pointer; z-index:200; }
    .add-btn:active { transform:scale(0.92); }
    .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); z-index:300; justify-content:center; align-items:center; padding:16px; }
    .modal.active { display:flex; }
    .modal-box { background:var(--card-bg); width:100%; max-width:440px; border-radius:20px; padding:24px; max-height:80vh; overflow-y:auto; }
    .modal-box h3 { font-size:18px; margin-bottom:16px; }
    .field-group { margin-bottom:14px; }
    .field-group label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:3px; }
    .field-group input, .field-group select, .field-group textarea { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; background:#fafbfc; }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color:var(--primary); outline:none; background:white; }
    .field-group textarea { min-height:50px; resize:vertical; }
    .expand-toggle { color:var(--primary); font-size:13px; cursor:pointer; padding:6px 0; display:inline-block; }
    .expand-area { display:none; margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; }
    .expand-area.open { display:block; }
    .btn-save { background:var(--primary); color:white; border:none; padding:13px; border-radius:12px; width:100%; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }
    .empty-state { text-align:center; color:var(--text-secondary); padding:40px 0; font-size:14px; }
    .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#1A1A2E; color:white; padding:10px 22px; border-radius:12px; font-size:13px; z-index:500; opacity:0; transition:0.3s; pointer-events:none; }
    .toast.show { opacity:1; }
    .insight-card { background:#f8f9fc; border-radius:12px; padding:12px 16px; margin-bottom:8px; border-left:4px solid var(--primary); font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; }
    .insight-card.warning { border-left-color:var(--warning); background:#fffbeb; }
    .insight-card.success { border-left-color:var(--success); background:#f0fdf4; }
    .insight-card.gentle { border-left-color:var(--gentle); background:#fdf2f8; }
    @media (max-width:420px) { .grid { gap:6px; } .card { padding:10px 2px; } .card .icon { font-size:22px; } .card .name { font-size:9px; } }
  </style>
</head>
<body>
  <div id="mainApp">
    <div class="header"><h1>🍆 <span>茄子管家</span></h1><button class="voice-btn" id="voiceBtn">🎤</button></div>
    <div class="scene-tips" id="sceneTips">🌅 早安！今天也要元气满满哦。</div>
    <div class="grid" id="moduleGrid"></div>
  </div>
  <div class="detail-page" id="detailPage">
    <div class="back-btn" id="backBtn"><span>‹ 返回</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <h2 id="detailTitle" style="font-size:19px;">模块</h2>
      <span id="recordCount" style="font-size:12px;color:var(--text-secondary);">0 条</span>
    </div>
    <div class="dashboard"><div style="font-size:12px;font-weight:600;color:var(--text-secondary);">📊 概览</div>
      <div class="dash-grid">
        <div class="dash-item"><div class="num" id="dash1">-</div><div class="label">总计</div></div>
        <div class="dash-item"><div class="num" id="dash2">-</div><div class="label">平均</div></div>
        <div class="dash-item"><div class="num" id="dash3">-</div><div class="label">最高</div></div>
      </div>
    </div>
    <div id="insightArea"></div>
    <div class="view-tabs">
      <div class="view-tab active" data-view="day">日</div>
      <div class="view-tab" data-view="week">周</div>
      <div class="view-tab" data-view="month">月</div>
      <div class="view-tab" data-view="year">年</div>
    </div>
    <div id="recordList"></div>
    <button class="add-btn" id="addRecordBtn">+</button>
  </div>
  <div class="modal" id="modal"><div class="modal-box">
    <h3 id="modalTitle">添加记录</h3>
    <div id="modalFields"></div>
    <div class="expand-toggle" id="expandToggle">▼ 展开更多字段</div>
    <div class="expand-area" id="expandArea"></div>
    <button class="btn-save" id="saveRecord">保存</button>
  </div></div>
  <div class="toast" id="toast"></div>
  <script>
    const D = new Date().toISOString().slice(0,10);
    const modules = [
      { id:'finance',label:'财务管理',icon:'💰',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'type',label:'收支类型',type:'select',options:['支出','收入','退款']},
        {key:'category',label:'分类',type:'select',options:['餐饮','交通','购物','娱乐','学习','医疗','人情','底薪','提成','其他']},
        {key:'amount',label:'金额',type:'number',placeholder:'请输入金额'}
      ],expand:[
        {key:'merchant',label:'商家/店铺',type:'text',placeholder:'请输入商家'},
        {key:'payment',label:'支付方式',type:'select',options:['微信','支付宝','现金','信用卡','银行卡']},
        {key:'intent',label:'消费意图',type:'select',options:['生存必需','社交应酬','投资自己','享乐消费','意外支出']},
        {key:'isCommission',label:'是否提成收入',type:'select',options:['否','是']},
        {key:'project',label:'关联项目',type:'text',placeholder:'输入项目名称'},
        {key:'note',label:'备注',type:'textarea',placeholder:'详细记录...'}
      ],dash:(d)=>{const i=d.filter(r=>r.type==='收入').reduce((s,r)=>s+Number(r.amount||0),0);const e=d.filter(r=>r.type==='支出').reduce((s,r)=>s+Number(r.amount||0),0);return{d1:{label:'结余',val:(i-e)+'元'},d2:{label:'总收入',val:i+'元'},d3:{label:'总支出',val:e+'元'}};}},
      { id:'sleep',label:'睡眠实验室',icon:'😴',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'sleepHours',label:'睡眠时长(h)',type:'number',placeholder:'如 7.5'},
        {key:'feeling',label:'晨起感受',type:'select',options:['1-很差','2-较差','3-一般','4-较好','5-很棒']}
      ],expand:[
        {key:'wakeCount',label:'醒来次数',type:'number',placeholder:'0'},
        {key:'dream',label:'梦境记录',type:'text',placeholder:'记得的梦境内容'},
        {key:'note',label:'备注',type:'textarea',placeholder:'其他睡眠情况...'}
      ],dash:(d)=>{const a=d.length?Math.round(d.reduce((s,r)=>s+Number(r.sleepHours||0),0)/d.length*10)/10:0;const b=d.length?Math.max(...d.map(r=>Number(r.sleepHours||0))):0;return{d1:{label:'平均时长',val:a+'h'},d2:{label:'最长',val:b+'h'},d3:{label:'记录天数',val:d.length}};}},
      { id:'menstrual',label:'经期记录',icon:'🌸',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'cycleDay',label:'经期第几天',type:'number',placeholder:'1-7'},
        {key:'flow',label:'经量',type:'select',options:['少','中','多']}
      ],expand:[
        {key:'pain',label:'痛经程度',type:'select',options:['1-无','2-轻微','3-中等','4-较重','5-严重']},
        {key:'mood',label:'情绪标签',type:'select',options:['平静','烦躁','低落','敏感','正常']},
        {key:'note',label:'备注',type:'textarea',placeholder:'其他情况...'}
      ],dash:(d)=>{const l=d.length?d[d.length-1]:null;return{d1:{label:'当前周期',val:l?'第'+l.cycleDay+'天':'-'},d2:{label:'本月记录',val:d.length},d3:{label:'规律性',val:d.length>3?'规律':'记录中'}};}},
      { id:'supplement',label:'营养补充站',icon:'💊',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'name',label:'补充剂名称',type:'text',placeholder:'维C/蛋白粉/钙片'},
        {key:'taken',label:'是否补充',type:'select',options:['是','否']}
      ],expand:[
        {key:'dosage',label:'剂量',type:'text',placeholder:'如 500mg'},
        {key:'brand',label:'品牌',type:'text',placeholder:'品牌名称'},
        {key:'note',label:'备注',type:'textarea',placeholder:'补充后感受...'}
      ],dash:(d)=>{const r=d.filter(x=>x.taken==='是').slice(-7).length;return{d1:{label:'近7天补充',val:r+'次'},d2:{label:'总记录',val:d.length},d3:{label:'坚持天数',val:d.filter(x=>x.taken==='是').length}};}},
      { id:'habit',label:'习惯打卡',icon:'✅',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'name',label:'习惯名称',type:'text',placeholder:'如：晨跑'},
        {key:'done',label:'完成状态',type:'select',options:['已完成','未完成']}
      ],expand:[
        {key:'duration',label:'时长(分钟)',type:'number',placeholder:'0'},
        {key:'difficulty',label:'难度自评',type:'select',options:['⭐简单','⭐⭐一般','⭐⭐⭐有挑战','⭐⭐⭐⭐很难','⭐⭐⭐⭐⭐极限']},
        {key:'failReason',label:'未完成原因',type:'select',options:['-','天气','身体不适','加班太忙','情绪低落','意志力不足','其他']},
        {key:'feel',label:'完成感受',type:'textarea',placeholder:'记录感受...'}
      ],dash:(d)=>{const dn=d.filter(r=>r.done==='已完成').length;const t=d.length||1;return{d1:{label:'完成率',val:Math.round(dn/t*100)+'%'},d2:{label:'已完成',val:dn},d3:{label:'总次数',val:t}};}},
      { id:'emotion',label:'情绪管理',icon:'😊',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'score',label:'评分(1-10)',type:'number',placeholder:'1-10'},
        {key:'tags',label:'情绪标签',type:'text',placeholder:'开心/焦虑/平静'}
      ],expand:[
        {key:'trigger',label:'触发因素',type:'text',placeholder:'工作/人际/健康等'},
        {key:'note',label:'备注',type:'textarea',placeholder:'详细记录...'}
      ],dash:(d)=>{const a=d.length?Math.round(d.reduce((s,r)=>s+Number(r.score||0),0)/d.length*10)/10:0;const r=d.length?d[d.length-1].score:'-';return{d1:{label:'平均分',val:a},d2:{label:'今日',val:r},d3:{label:'记录数',val:d.length}};}},
      { id:'mental_health',label:'心理健康',icon:'🧠',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'phq9Score',label:'PHQ-9得分',type:'number',placeholder:'0-27'},
        {key:'gad7Score',label:'GAD-7得分',type:'number',placeholder:'0-21'}
      ],expand:[
        {key:'stressLevel',label:'压力自评',type:'select',options:['1-很低','2-较低','3-中等','4-较高','5-很高']},
        {key:'coping',label:'应对方式',type:'text',placeholder:'运动/倾诉/休息'},
        {key:'note',label:'备注',type:'textarea',placeholder:'详细记录...'}
      ],dash:(d)=>{const l=d.length?d[d.length-1]:null;return{d1:{label:'PHQ-9',val:l?l.phq9Score:'-'},d2:{label:'GAD-7',val:l?l.gad7Score:'-'},d3:{label:'记录数',val:d.length}};}},
      { id:'diary',label:'日记复盘',icon:'📖',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'content',label:'今日日记',type:'textarea',placeholder:'记录今天发生的事...'},
        {key:'mood',label:'今日心情',type:'select',options:['😊开心','😐一般','😢低落','😡生气','😌平静']}
      ],expand:[
        {key:'gratitude',label:'感恩三件事',type:'textarea',placeholder:'今天值得感恩的三件事...'},
        {key:'learned',label:'今天学到的',type:'text',placeholder:'今天学到了什么'},
        {key:'review',label:'复盘反思',type:'textarea',placeholder:'做得好的/需要改进的'},
        {key:'nextAction',label:'明天行动',type:'text',placeholder:'明天要做什么'}
      ],dash:(d)=>{const r=d.slice(-7).filter(x=>x.content&&x.content.length>0).length;return{d1:{label:'近7天日记',val:r+'篇'},d2:{label:'总篇数',val:d.length},d3:{label:'连续天数',val:d.filter(x=>x.content).length}};}},
      { id:'pet',label:'宠物护理',icon:'🐱',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'petName',label:'宠物名',type:'text',placeholder:'🍆'},
        {key:'eventType',label:'事件类型',type:'select',options:['喂食','换猫砂','驱虫','体检','玩耍','其他']}
      ],expand:[
        {key:'note',label:'备注',type:'textarea',placeholder:'详细记录...'},
        {key:'nextDue',label:'下次提醒日期',type:'date'}
      ],dash:(d)=>{const f=d.filter(r=>r.eventType==='喂食').length;return{d1:{label:'喂食记录',val:f+'次'},d2:{label:'总事件',val:d.length},d3:{label:'健康',val:d.length>5?'良好':'记录中'}};}},
      { id:'diet',label:'饮食记录',icon:'🍽️',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'meal',label:'餐次',type:'select',options:['早餐','午餐','晚餐','加餐']},
        {key:'content',label:'内容',type:'text',placeholder:'吃了什么'}
      ],expand:[
        {key:'calories',label:'卡路里(千卡)',type:'number',placeholder:'约多少千卡'},
        {key:'protein',label:'蛋白质(g)',type:'number',placeholder:'约多少克'},
        {key:'type',label:'饮食模式',type:'select',options:['自己做饭','外卖','堂食']},
        {key:'nutrition',label:'营养评估',type:'select',options:['均衡','碳水偏高','蛋白不足','油脂偏多','优秀']},
        {key:'note',label:'备注',type:'textarea',placeholder:'其他情况...'}
      ],dash:(d)=>{const a=d.length?Math.round(d.reduce((s,r)=>s+Number(r.calories||0),0)/d.length):0;return{d1:{label:'日均热量',val:a+'kcal'},d2:{label:'蛋白充足',val:d.filter(r=>Number(r.protein||0)>=20).length+'天'},d3:{label:'记录数',val:d.length}};}},
      { id:'career',label:'职业发展',icon:'💼',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'company',label:'公司/岗位',type:'text',placeholder:'当前公司'},
        {key:'kpiProgress',label:'KPI进度%',type:'number',placeholder:'0-100'}
      ],expand:[
        {key:'okr',label:'本季度OKR',type:'text',placeholder:'关键目标'},
        {key:'review',label:'月度复盘',type:'textarea',placeholder:'本月成果与不足'},
        {key:'nextPlan',label:'晋升规划',type:'text',placeholder:'下一步计划'}
      ],dash:(d)=>{const l=d.length?d[d.length-1]:null;return{d1:{label:'KPI进度',val:l?l.kpiProgress+'%':'-'},d2:{label:'记录数',val:d.length},d3:{label:'状态',val:l?'进行中':'待开始'}};}},
      { id:'job_search',label:'求职管理',icon:'🔍',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'company',label:'目标公司',type:'text',placeholder:'公司名称'},
        {key:'position',label:'岗位',type:'text',placeholder:'岗位名称'}
      ],expand:[
        {key:'salary',label:'薪资范围',type:'text',placeholder:'如 8k-12k'},
        {key:'status',label:'状态',type:'select',options:['简历投递','面试中','已拿到Offer','已入职','已拒绝']},
        {key:'pros',label:'优点',type:'textarea',placeholder:'这家公司的优势'},
        {key:'cons',label:'缺点',type:'textarea',placeholder:'需要注意的地方'},
        {key:'note',label:'备注',type:'textarea',placeholder:'面试记录/对比'}
      ],dash:(d)=>{const o=d.filter(r=>r.status==='已拿到Offer').length;return{d1:{label:'已投递',val:d.length},d2:{label:'Offer数',val:o},d3:{label:'面试中',val:d.filter(r=>r.status==='面试中').length}};}},
      { id:'business',label:'商业管理',icon:'📊',base:[
        {key:'date',label:'日期',type:'date',default:D},
        {key:'project',label:'项目名称',type:'text',placeholder:'项目名'},
        {key:'status',label:'进度状态',type:'select',options:['规划中','进行中','已完成','暂停']}
      ],expand:[
        {key:'cost',label:'成本(元)',type:'number',placeholder:'0'},
        {key:'revenue',label:'收入(元)',type:'number',placeholder:'0'},

    let currentModule=null, currentData=[], currentView='day', editingIndex=-1;

    // 渲染模块卡片
    const grid=document.getElementById('moduleGrid');
    modules.forEach(m=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div class="icon">'+m.icon+'</div><div class="name">'+m.label+'</div>';d.onclick=()=>openModule(m.id);grid.appendChild(d);});

    async function openModule(id){
      currentModule=id;
      const meta=modules.find(m=>m.id===id);
      document.getElementById('detailTitle').textContent=meta.icon+' '+meta.label;
      document.getElementById('detailPage').classList.add('active');
      await loadData(id);
      renderDashboard(id);
      renderInsights(id);
      renderList(id,currentView);
      document.getElementById('recordCount').textContent=currentData.length+' 条';
    }

    async function loadData(id){
      try{const r=await fetch('/api/'+id);currentData=await r.json();}catch(e){currentData=[];}
    }

    function renderDashboard(id){
      const meta=modules.find(m=>m.id===id);
      if(!meta||!meta.dash)return;
      try{
        const s=meta.dash(currentData);
        document.getElementById('dash1').textContent=s.d1.val;
        document.getElementById('dash2').textContent=s.d2.val;
        document.getElementById('dash3').textContent=s.d3.val;
        document.querySelectorAll('.dash-item .label')[0].textContent=s.d1.label;
        document.querySelectorAll('.dash-item .label')[1].textContent=s.d2.label;
        document.querySelectorAll('.dash-item .label')[2].textContent=s.d3.label;
      }catch(e){}
    }

    async function renderInsights(id){
      const area=document.getElementById('insightArea');
      try{
        const r=await fetch('/api/insights/'+id);
        const data=await r.json();
        if(data.insights&&data.insights.length>0){
          area.innerHTML=data.insights.map(i=>'<div class="insight-card '+(i.type||'')+'"><span>💡</span>'+i.msg+'</div>').join('');
        }else{area.innerHTML='<div class="insight-card">💡 继续记录，我会给你更多建议。</div>';}
      }catch(e){area.innerHTML='<div class="insight-card">💡 继续记录，我会给你更多建议。</div>';}
    }

    function renderList(id,view){
      const list=document.getElementById('recordList');
      const meta=modules.find(m=>m.id===id);
      if(!meta)return;
      if(currentData.length===0){list.innerHTML='<div class="empty-state">📭 还没有记录，点 + 添加一条</div>';return;}
      let filtered=[...currentData];
      const now=new Date();
      if(view==='week'){const start=new Date(now);start.setDate(now.getDate()-7);filtered=filtered.filter(r=>new Date(r.date)>=start);}
      else if(view==='month'){filtered=filtered.filter(r=>{const d=new Date(r.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});}
      else if(view==='year'){filtered=filtered.filter(r=>new Date(r.date).getFullYear()===now.getFullYear());}

      list.innerHTML=filtered.slice().reverse().map(row=>{
        const realIdx=currentData.indexOf(row);
        let label=row.title||row.name||row.content||row.skillName||row.bookName||row.task||row.item||row.destination||row.hobbyName||row.project||'记录';
        if(label&&label.length>20)label=label.slice(0,20)+'...';
        let sub='';
        if(row.amount)sub='金额:'+row.amount+'元';
        else if(row.sleepHours)sub='睡眠:'+row.sleepHours+'h';
        else if(row.score)sub='评分:'+row.score;
        else if(row.progress)sub='进度:'+row.progress+'%';
        else if(row.kpiProgress)sub='KPI:'+row.kpiProgress+'%';
        else if(row.done)sub='状态:'+row.done;
        else if(row.status)sub='状态:'+row.status;
        else sub=Object.keys(row).filter(k=>!['date','id','note','_id'].includes(k)).slice(0,2).map(k=>k+':'+row[k]).join(' ');
        let amountHtml='';
        if(row.amount){const cls=row.type==='支出'?'expense':'income';amountHtml='<div class="right"><div class="amount '+cls+'">'+(row.type==='支出'?'-':'')+row.amount+'</div><div class="date">'+(row.date||'')+'</div></div>';}
        else{amountHtml='<div class="right"><div class="date">'+(row.date||'')+'</div></div>';}
        return '<div class="list-wrapper" data-index="'+realIdx+'"><div class="list-item" data-idx="'+realIdx+'"><div class="main"><div class="title">'+label+'</div><div class="sub">'+sub+'</div></div>'+amountHtml+'</div><div class="list-actions"><button class="action-btn edit" data-idx="'+realIdx+'">✏️</button><button class="action-btn delete" data-idx="'+realIdx+'">🗑️</button></div></div>';
      }).join('');

      document.querySelectorAll('.list-wrapper').forEach(wrapper=>{
        const item=wrapper.querySelector('.list-item');
        const actions=wrapper.querySelector('.list-actions');
        item.addEventListener('click',()=>{const idx=parseInt(item.dataset.idx);if(!isNaN(idx))openEditModal(idx);});
        wrapper.querySelector('.edit').addEventListener('click',e=>{e.stopPropagation();const idx=parseInt(e.target.dataset.idx);openEditModal(idx);actions.style.transform='translateX(0)';});
        wrapper.querySelector('.delete').addEventListener('click',e=>{e.stopPropagation();const idx=parseInt(e.target.dataset.idx);if(confirm('确定删除？')){currentData.splice(idx,1);saveData(currentModule);renderList(currentModule,currentView);renderDashboard(currentModule);showToast('已删除');}actions.style.transform='translateX(0)';});
      });
    }

    function openEditModal(idx){
      editingIndex=idx;
      const row=currentData[idx];
      const meta=modules.find(m=>m.id===currentModule);
      document.getElementById('modalTitle').textContent='编辑记录';
      renderFormFields(meta,row);
      document.getElementById('modal').classList.add('active');
    }

    function renderFormFields(meta,existing){
      const fieldsDiv=document.getElementById('modalFields');
      const expandDiv=document.getElementById('expandArea');
      let baseHtml='';
      meta.base.forEach(f=>{
        const val=existing?existing[f.key]||'':(f.default||'');
        if(f.type==='date')baseHtml+='<div class="field-group"><label>'+f.label+'</label><input type="date" id="field_'+f.key+'" value="'+val+'"></div>';
        else if(f.type==='select'){const opts=f.options.map(o=>'<option value="'+o+'" '+(val===o?'selected':'')+'>'+o+'</option>').join('');baseHtml+='<div class="field-group"><label>'+f.label+'</label><select id="field_'+f.key+'">'+opts+'</select></div>';}
        else if(f.type==='textarea')baseHtml+='<div class="field-group"><label>'+f.label+'</label><textarea id="field_'+f.key+'" placeholder="'+(f.placeholder||'')+'">'+val+'</textarea></div>';
        else baseHtml+='<div class="field-group"><label>'+f.label+'</label><input type="'+(f.type||'text')+'" id="field_'+f.key+'" value="'+val+'" placeholder="'+(f.placeholder||'')+'"></div>';
      });
      fieldsDiv.innerHTML=baseHtml;
      let expandHtml='';
      if(meta.expand){
        meta.expand.forEach(f=>{
          const val=existing?existing[f.key]||'':'';
          if(f.type==='select'){const opts=f.options.map(o=>'<option value="'+o+'" '+(val===o?'selected':'')+'>'+o+'</option>').join('');expandHtml+='<div class="field-group"><label>'+f.label+'</label><select id="field_'+f.key+'">'+opts+'</select></div>';}
          else if(f.type==='textarea')expandHtml+='<div class="field-group"><label>'+f.label+'</label><textarea id="field_'+f.key+'" placeholder="'+(f.placeholder||'')+'">'+val+'</textarea></div>';
          else expandHtml+='<div class="field-group"><label>'+f.label+'</label><input type="'+(f.type||'text')+'" id="field_'+f.key+'" value="'+val+'" placeholder="'+(f.placeholder||'')+'"></div>';
        });
      }
      expandDiv.innerHTML=expandHtml;
      document.getElementById('expandArea').classList.remove('open');
      document.getElementById('expandToggle').textContent='▼ 展开更多字段';
    }

    async function saveData(id){
      await fetch('/api/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentData)});
    }

    document.getElementById('saveRecord').onclick=async()=>{
      const meta=modules.find(m=>m.id===currentModule);
      const obj={};
      [...meta.base,...(meta.expand||[])].forEach(f=>{const el=document.getElementById('field_'+f.key);if(el)obj[f.key]=el.value;});
      if(editingIndex>=0){currentData[editingIndex]=obj;}else{currentData.push(obj);}
      await saveData(currentModule);
      document.getElementById('modal').classList.remove('active');
      renderList(currentModule,currentView);
      renderDashboard(currentModule);
      renderInsights(currentModule);
      document.getElementById('recordCount').textContent=currentData.length+' 条';
      showToast(editingIndex>=0?'已更新':'已添加');
      editingIndex=-1;
    };

    document.getElementById('backBtn').onclick=()=>{document.getElementById('detailPage').classList.remove('active');};
    document.getElementById('addRecordBtn').onclick=()=>{
      editingIndex=-1;
      const meta=modules.find(m=>m.id===currentModule);
      document.getElementById('modalTitle').textContent='添加 '+meta.label;
      renderFormFields(meta,null);
      document.getElementById('modal').classList.add('active');
    };
    document.querySelectorAll('.view-tab').forEach(tab=>{
      tab.onclick=()=>{document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentView=tab.dataset.view;renderList(currentModule,currentView);};
    });
    document.getElementById('expandToggle').onclick=function(){
      const area=document.getElementById('expandArea');
      area.classList.toggle('open');
      this.textContent=area.classList.contains('open')?'▲ 收起扩展字段':'▼ 展开更多字段';
    };
    document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('modal').classList.remove('active');});

    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

    document.getElementById('voiceBtn').onclick=()=>{
      if(!('webkitSpeechRecognition' in window)){alert('请使用 Chrome 或 Safari 浏览器');return;}
      const rec=new webkitSpeechRecognition();
      rec.lang='zh-CN';
      rec.onresult=async e=>{
        const text=e.results[0][0].transcript;
        showToast('🎤 识别中: '+text);
        try{
          const r=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
          const result=await r.json();
          showToast(result.message||'已执行');
          if(result.action==='add_record'&&result.module){
            if(currentModule===result.module){await loadData(result.module);renderList(result.module,currentView);renderDashboard(result.module);renderInsights(result.module);}
          }
        }catch(err){showToast('语音识别失败');}
      };
      rec.start();
    };

    function updateScene(){
      const h=new Date().getHours();
      const tip=document.getElementById('sceneTips');
      if(h<9)tip.innerHTML='🌅 早安！开启新的一天，先看看今日日程吧。';
      else if(h<12)tip.innerHTML='☀️ 上午好！专注工作，别忘了喝水哦。';
      else if(h<14)tip.innerHTML='🌤️ 午休时间，小憩一下或记录情绪。';
      else if(h<18)tip.innerHTML='📈 下午加油！检查一下愿望清单进度。';
      else tip.innerHTML='🌙 夜晚了，复盘今天，准备明天。';
    }
    updateScene();
  </script>
</body>
</html>
