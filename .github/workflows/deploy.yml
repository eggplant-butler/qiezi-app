name: Auto Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: 上传代码到服务器（仅代码文件，不含 data/）
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          source: "server.js,package.json,frontend,deploy.sh"
          target: "/home/ubuntu/qiezi-app/"
          overwrite: true
      - name: 安装依赖并重启服务
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/ubuntu/qiezi-app
            # 确保编译工具链存在（better-sqlite3 需要）
            sudo apt-get install -y python3 make g++ build-essential 2>/dev/null || true
            # 安装依赖（按 package.json，不覆盖 data/backups）
            npm install --no-audit --no-fund
            # 零停机重启
            pm2 reload eggplant 2>/dev/null || pm2 restart eggplant 2>/dev/null || pm2 start server.js --name eggplant
            pm2 save
            sleep 3
            # 深度健康检查
            HEALTH=$(curl -s http://localhost:3000/api/health)
            echo "健康检查: $HEALTH"
            echo "$HEALTH" | grep -q '"status":"ok"' && echo "===部署成功===" || (echo "===部署失败，检查日志===" && pm2 logs eggplant --lines 20 --nostream)
