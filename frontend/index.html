<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>茄子管家 · 复利版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#0F0A1E;color:#E2E8F0;min-height:100vh;padding-bottom:80px}
#lock{position:fixed;inset:0;background:#0F0A1E;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
#lock input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 20px;width:280px;color:#fff;font-size:18px;text-align:center;outline:none}
#lock input:focus{border-color:#8B5CF6}
#lock button{background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;border-radius:12px;padding:14px 30px;color:#fff;font-size:18px;font-weight:600;cursor:pointer;margin-top:16px}
#lock .err{color:#EF4444;margin-top:8px;display:none}
#app{display:none;max-width:480px;margin:0 auto;padding:16px 16px 80px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hd h1{font-size:20px;font-weight:700;background:linear-gradient(to right,#fff,#C4B5FD);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd-r{display:flex;gap:8px;align-items:center}
.hd-r .badge{background:#EF4444;color:#fff;font-size:10px;border-radius:10px;padding:0 8px;line-height:18px}
.hd-r button{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:6px 12px;color:#CBD5E1;font-size:14px;cursor:pointer}
.greet{background:rgba(255,255,255,0.04);border-radius:14px;padding:14px 18px;margin-bottom:16px;border-left:4px solid #8B5CF6}
.greet .d{font-size:13px;color:#94A3B8}
.greet .t{font-size:15px;color:#E2E8F0;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.greet .t strong{color:#fff}
.greet .t .phase-badge{background:rgba(139,92,246,0.2);color:#A78BFA;font-size:11px;border-radius:12px;padding:2px 12px;line-height:22px}
.greet .t .remind-badge{background:#EF4444;color:#fff;font-size:10px;border-radius:10px;padding:0 10px;line-height:20px;cursor:pointer}
.growth-bar{background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04)}
.growth-bar .row{display:flex;justify-content:space-between;align-items:center}
.growth-bar .phase{font-size:13px;font-weight:600;color:#A78BFA}
.growth-bar .progress{font-size:12px;color:#94A3B8}
.growth-bar .bar{height:4px;background:rgba(255,255,255,0.06);border-radius:4px;margin-top:6px;overflow:hidden}
.growth-bar .bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#8B5CF6,#EC4899);transition:width 0.8s}
.growth-bar .desc{font-size:11px;color:#64748B;margin-top:4px}
.overview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.overview-card{background:rgba(255,255,255,0.04);border-radius:12px;padding:10px 8px;text-align:center;border:1px solid rgba(255,255,255,0.04)}
.overview-card .num{font-size:20px;font-weight:700;color:#A78BFA}
.overview-card .label{font-size:10px;color:#94A3B8;margin-top:2px}
.input-area{background:rgba(255,255,255,0.04);border-radius:14px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,0.06)}
.input-area input{flex:1;background:transparent;border:none;color:#F1F5F9;font-size:15px;outline:none;padding:6px 0}
.input-area input::placeholder{color:#64748B}
.input-area button{background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;border-radius:10px;padding:8px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.focus-card{background:rgba(255,255,255,0.04);border-radius:12px;padding:12px 14px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:0.15s}
.focus-card:active{transform:scale(0.96)}
.focus-card .top{display:flex;justify-content:space-between;align-items:center}
.focus-card .ic{font-size:18px}
.focus-card .nm{font-size:13px;font-weight:600;color:#F1F5F9}
.focus-card .br{font-size:10px;color:#94A3B8;margin-top:2px}
.focus-card .progress{height:3px;background:rgba(255,255,255,0.06);border-radius:4px;margin-top:8px;overflow:hidden}
.focus-card .progress .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#8B5CF6,#EC4899);transition:width 0.5s}
.focus-card .status{font-size:9px;padding:1px 8px;border-radius:10px}
.focus-card .status.active{background:rgba(34,197,94,0.2);color:#22C55E}
.focus-card .status.steady{background:rgba(251,191,36,0.2);color:#FBBF24}
.focus-card .status.learning{background:rgba(139,92,246,0.2);color:#A78BFA}
.quick-modules{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.quick-module{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 4px;text-align:center;border:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:0.15s}
.quick-module:active{transform:scale(0.94)}
.quick-module .ic{font-size:18px}
.quick-module .nm{font-size:10px;color:#94A3B8;margin-top:2px}
.quick-module .cnt{font-size:9px;color:#64748B}
.correlation-list{margin:8px 0}
.corr-item{background:rgba(167,139,250,0.06);border-radius:10px;padding:10px 14px;margin-bottom:6px;border-left:3px solid #A78BFA}
.corr-item .title{font-size:13px;font-weight:600;color:#F1F5F9}
.corr-item .detail{font-size:12px;color:#94A3B8;margin-top:2px}
.suggestion-item{background:rgba(251,191,36,0.06);border-radius:10px;padding:10px 14px;margin-bottom:6px;border-left:3px solid #FBBF24;font-size:13px;color:#E2E8F0}
.suggestion-item .actions{display:flex;gap:6px;margin-top:6px}
.suggestion-item .actions button{background:rgba(255,255,255,0.06);border:none;border-radius:6px;padding:4px 12px;color:#CBD5E1;font-size:11px;cursor:pointer}
.suggestion-item .actions button.done{background:rgba(34,197,94,0.2);color:#22C55E}
.suggestion-item .actions button.skip{background:rgba(239,68,68,0.2);color:#EF4444}
.suggestion-item .feedback{font-size:11px;color:#64748B;margin-top:4px}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,10,30,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.04);display:flex;padding:6px 0 14px;max-width:480px;margin:0 auto;z-index:100}
.tab{flex:1;text-align:center;color:#64748B;font-size:10px;cursor:pointer;padding:2px 0}
.tab .ic{font-size:20px;display:block}
.tab.act{color:#A78BFA}
.pg{display:none}
.pg.act{display:block}
.detail{display:none;padding-bottom:80px}
.detail.act{display:block}
.back{background:transparent;border:none;color:#A78BFA;font-size:16px;cursor:pointer;margin-bottom:12px}
.rec{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 14px;margin-bottom:6px;border:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center}
.rec .tt{font-size:13px;color:#F1F5F9}
.rec .sb{font-size:10px;color:#94A3B8;margin-top:2px}
.rec .ac button{background:transparent;border:none;color:#64748B;cursor:pointer;padding:0 4px;font-size:14px}
.rec .ac .dl{color:#EF4444}
.add{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;color:#fff;font-size:28px;box-shadow:0 4px 16px rgba(139,92,246,0.4);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(8px)}
.modal.act{display:flex}
.modal-b{background:#1E1B4B;border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.modal-b h3{font-size:16px;margin-bottom:12px;color:#F1F5F9}
.modal-b label{display:block;font-size:12px;color:#94A3B8;margin-bottom:4px;margin-top:10px}
.modal-b input,.modal-b select,.modal-b textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#F1F5F9;font-size:14px;font-family:inherit;margin-bottom:4px}
.modal-b textarea{min-height:50px;resize:vertical}
.modal-b .row{display:flex;gap:8px;margin-top:12px}
.modal-b .row button{flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.modal-b .sv{background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff}
.modal-b .cn{background:rgba(255,255,255,0.06);color:#94A3B8}
.space-item{background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
.space-item .top{display:flex;justify-content:space-between;align-items:center}
.space-item .nm{font-size:14px;font-weight:600;color:#F1F5F9}
.space-item .cnt{font-size:12px;color:#94A3B8}
.space-item .sub{font-size:11px;color:#64748B;margin-top:2px}
.empty{text-align:center;padding:30px 0;color:#64748B}
.empty .ic{font-size:36px;display:block;margin-bottom:8px}
.milestone-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:#CBD5E1}
.milestone-item .ic{font-size:18px}
</style>
</head>
<body>
<div id="lock">
<div style="text-align:center;max-width:320px">
<h1 style="font-size:28px;font-weight:700;background:linear-gradient(to right,#fff,#C4B5FD);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px">🍆 茄子管家</h1>
<p style="color:#94A3B8;margin-bottom:24px">输入密码进入你的空间</p>
<input type="password" id="pwdI" placeholder="请输入密码">
<button onclick="login()">进入</button>
<div class="err" id="pwdErr">密码错误</div>
</div>
</div>
<div id="app">
<div class="hd"><h1>🍆 茄子管家</h1><div class="hd-r"><span class="badge" id="remindBadge" style="display:none">•</span><button onclick="togglePrivacy()">👁️</button><button onclick="switchTab('me')">⚙️</button></div></div>
<div class="greet"><div class="d" id="todayD"></div><div class="t"><span id="greetT">加载中...</span><span class="phase-badge" id="phaseBadge">🌱 萌芽期</span></div></div>

<div id="dailyQuestionArea" style="background:rgba(255,255,255,0.04);border-radius:14px;padding:14px 16px;margin-bottom:16px;border-left:4px solid #A78BFA;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:11px;color:#94A3B8;">💭 今日之问</span>
    <span style="font-size:10px;color:#64748B;cursor:pointer;" onclick="viewQuestionHistory()">历史</span>
  </div>
  <div id="dailyQuestionText" style="font-size:15px;color:#F1F5F9;font-weight:500;margin-bottom:8px;">加载中...</div>
  <div style="display:flex;gap:8px;">
    <input type="text" id="dailyQuestionInput" placeholder="写下你的回答..." style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#F1F5F9;font-size:14px;outline:none;">
    <button onclick="submitDailyAnswer()" style="background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;border-radius:8px;padding:8px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">回答</button>
  </div>
  <div id="dailyAnswerDisplay" style="margin-top:8px;font-size:13px;color:#94A3B8;display:none;"></div>
</div>

<div class="growth-bar" id="growthBar">
<div class="row"><span class="phase" id="phaseLabel">🌱 萌芽期</span><span class="progress" id="progressLabel">0%</span></div>
<div class="bar"><div class="fill" id="growthFill" style="width:0%"></div></div>
<div class="desc" id="phaseDesc">开始记录，让习惯成为自然</div>
</div>

<div class="pg act" id="pgHome">
<div class="overview" id="overviewGrid">
<div class="overview-card"><div class="num" id="ovSleep">-</div><div class="label">平均睡眠</div></div>
<div class="overview-card"><div class="num" id="ovMood">-</div><div class="label">平均情绪</div></div>
<div class="overview-card"><div class="num" id="ovDays">-</div><div class="label">连续记录</div></div>
</div>
<div class="input-area"><input type="text" id="nlInput" placeholder="说一句话记录... 如：中午吃了鸡胸肉沙拉"><button onclick="nlSubmit()">发送</button></div>
<div class="focus-grid" id="focusGrid"></div>
<div class="quick-modules" id="quickModules"></div>

<!-- ====== 闪念笔记 ====== -->
<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;font-weight:600;color:#F1F5F9;">💭 闪念笔记</span>
    <span style="font-size:10px;color:#64748B;cursor:pointer;" onclick="showQuickNotes()">查看全部</span>
  </div>
  <div style="display:flex;gap:8px;">
    <input type="text" id="quickNoteInput" placeholder="随便记一下... 系统会自动归类" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#F1F5F9;font-size:14px;outline:none;">
    <button onclick="submitQuickNote()" style="background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;border-radius:8px;padding:8px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">记</button>
  </div>
  <div id="quickNoteFeedback" style="margin-top:6px;font-size:12px;color:#94A3B8;"></div>
</div>

<!-- ====== 缴费管理 ====== -->
<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;font-weight:600;color:#F1F5F9;">💰 待缴费</span>
    <span style="font-size:10px;color:#64748B;cursor:pointer;" onclick="openAddBill()">+ 添加</span>
  </div>
  <div id="billsList" style="font-size:13px;color:#94A3B8;min-height:20px;">加载中...</div>
</div>

<!-- ====== 阅读打卡 ====== -->
<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;font-weight:600;color:#F1F5F9;">📚 阅读打卡</span>
    <span style="font-size:10px;color:#64748B;cursor:pointer;" onclick="openAddReading()">+ 添加</span>
  </div>
  <div id="readingStats" style="display:flex;gap:16px;font-size:12px;color:#94A3B8;margin-bottom:4px;"></div>
  <div id="readingToday" style="font-size:13px;color:#CBD5E1;"></div>
</div>

<!-- ====== 家务引擎 ====== -->
<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;font-weight:600;color:#F1F5F9;">🧹 家务</span>
    <span style="display:flex;gap:6px;align-items:center;">
      <span id="houseworkModeBadge" style="font-size:10px;padding:2px 10px;border-radius:10px;background:rgba(139,92,246,0.15);color:#A78BFA;">正常</span>
      <button onclick="switchHouseworkMode()" style="background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:2px 8px;color:#94A3B8;font-size:10px;cursor:pointer;">切换</button>
    </span>
  </div>
  <div id="houseworkList" style="font-size:13px;color:#94A3B8;min-height:20px;">加载中...</div>
</div>

<!-- ====== 社交人脉 ====== -->
<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;font-weight:600;color:#F1F5F9;">👥 社交</span>
    <span style="font-size:10px;color:#64748B;cursor:pointer;" onclick="openAddContact()">+ 添加</span>
  </div>
  <div id="socialList" style="font-size:13px;color:#94A3B8;min-height:20px;">加载中...</div>
</div>

<!-- ====== 成就系统 ====== -->
<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;font-weight:600;color:#F1F5F9;">🏆 成就</span>
    <span style="font-size:10px;color:#64748B;cursor:pointer;" onclick="viewAchievements()">查看全部</span>
  </div>
  <div id="achievementList" style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;min-height:20px;">加载中...</div>
</div>

<div id="homeCorrelations"></div>
<div id="homeSuggestions"></div>
</div>

<div class="pg" id="pgRecord"><div id="recordList"></div></div>
<div class="pg" id="pgInsight"><div id="insightContent"></div></div>
<div class="pg" id="pgMe"><div id="meContent"></div></div>

<div class="detail" id="detail"><button class="back" onclick="closeDetail()">‹ 返回</button><h2 id="detailTitle"></h2><div id="detailContent"></div><button class="add" onclick="openAdd()">+</button></div>

<div class="modal" id="modal"><div class="modal-b"><h3 id="modalTitle">添加记录</h3><div id="modalBody"></div><div class="row"><button class="sv" onclick="saveRecord()">保存</button><button class="cn" onclick="closeModal()">取消</button></div></div></div>

<div class="bar"><div class="tab act" onclick="switchTab('home')"><span class="ic">🏠</span>首页</div><div class="tab" onclick="switchTab('record')"><span class="ic">📋</span>记录</div><div class="tab" onclick="switchTab('insight')"><span class="ic">🔮</span>洞察</div><div class="tab" onclick="switchTab('me')"><span class="ic">👤</span>我</div></div>
</div>

<script>
var PWD = 'eggplant';
var KEY = 'qzos_';
var TODAY = new Date().toISOString().split('T')[0];
var curScene = null, editId = null, privacyOn = false;
var dataCache = {};
var insightsCache = null;
var suggestionFeedback = {};

var SCENES = [
{id:'work',name:'我的工作',icon:'💼',brief:'职业·收入·意义'},
{id:'home',name:'我的居住',icon:'🏠',brief:'空间·物品·安全'},
{id:'travel',name:'我的出行',icon:'🛵',brief:'通勤·自由·掌控'},
{id:'body',name:'我的身体',icon:'💪',brief:'睡眠·锻炼·饮食'},
{id:'relation',name:'我的关系',icon:'👥',brief:'父母·同事·朋友'},
{id:'time',name:'我的时间',icon:'⏰',brief:'分配·频率·充实'},
{id:'growth',name:'我的成长',icon:'🌱',brief:'学习·技能·方向'},
{id:'spirit',name:'我的精神',icon:'🧠',brief:'日志·信念·价值'}
];

// 修复：health->body, mind->think，匹配后端模块
var FOCUS = [
{id:'work',label:'工作收入',icon:'💼',desc:'稳定收入·增长路径',status:'active'},
{id:'photo',label:'摄影能力',icon:'📷',desc:'技能积累·表达出口',status:'learning'},
{id:'body',label:'身体健康',icon:'💪',desc:'能量基础·一切前提',status:'steady'},
{id:'think',label:'认知思考',icon:'🧠',desc:'决策质量·成长引擎',status:'learning'}
];

var CORE_MODULES = [
{id:'finance',label:'财务',icon:'💰'},{id:'sleep',label:'睡眠',icon:'😴'},
{id:'exercise',label:'锻炼',icon:'🏃'},{id:'emotion',label:'情绪',icon:'😊'},
{id:'diet',label:'饮食',icon:'🥗'},{id:'diary',label:'日记',icon:'📖'},
{id:'learn',label:'学习复盘',icon:'📚'},{id:'photo',label:'摄影',icon:'📷'},
{id:'think',label:'认知思考',icon:'🧠'},{id:'inventory',label:'库存',icon:'📦'},

async function apiFetch(m) {
  try {
    const r = await fetch('/api/' + m);
    const d = await r.json();
    dataCache[m] = d;
    return d;
  } catch(e) { return dataCache[m] || []; }
}
async function apiSave(m, d) {
  try { await fetch('/api/' + m, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d) }); dataCache[m] = d; } catch(e) {}
}
async function apiAdd(m, r) {
  try { await fetch('/api/' + m + '/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(r) }); if (!dataCache[m]) dataCache[m] = []; dataCache[m].push(r); } catch(e) { if (!dataCache[m]) dataCache[m] = []; dataCache[m].push(r); }
}
async function apiDelete(m, id) {
  try { await fetch('/api/' + m + '/' + id, { method:'DELETE' }); if (dataCache[m]) dataCache[m] = dataCache[m].filter(i => i.id !== id); } catch(e) { if (dataCache[m]) dataCache[m] = dataCache[m].filter(i => i.id !== id); }
}
async function fetchInsights() {
  try { const r = await fetch('/api/insights'); insightsCache = await r.json(); } catch(e) { insightsCache = null; }
}

async function loadDailyQuestion() {
  try {
    var r = await fetch('/api/daily-question');
    var d = await r.json();
    var textEl = document.getElementById('dailyQuestionText');
    if (textEl) textEl.textContent = d.question;
    var disp = document.getElementById('dailyAnswerDisplay');
    var inp = document.getElementById('dailyQuestionInput');
    if (d.answer) {
      if (disp) { disp.style.display = 'block'; disp.textContent = '✅ 已回答：' + d.answer; }
      if (inp) { inp.value = ''; inp.placeholder = '已回答，明天再来'; inp.disabled = true; }
    } else {
      if (disp) disp.style.display = 'none';
      if (inp) { inp.disabled = false; inp.placeholder = '写下你的回答...'; }
    }
  } catch(e) { console.warn('加载今日之问失败', e); }
}

async function submitDailyAnswer() {
  var inp = document.getElementById('dailyQuestionInput');
  if (!inp) return;
  var ans = inp.value.trim();
  if (!ans) { alert('请先写下你的回答'); return; }
  try {
    var today = new Date().toISOString().split('T')[0];
    var r = await fetch('/api/daily-question/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer: ans, date: today })
    });
    var d = await r.json();
    if (d.success) {
      alert('✅ 回答已保存！深度评分：' + d.depthScore + '/5');
      loadDailyQuestion();
      if (typeof renderOverview === 'function') renderOverview();
    } else {
      alert('保存失败：' + d.message);
    }
  } catch(e) { alert('网络错误，请重试'); }
}

function parseNL(text){
  var modules = {
    finance:['花了','买了','消费','支出','收入','工资','提成','付了'],
    sleep:['睡了','醒','困','失眠','做梦','作息','熬夜'],
    exercise:['跑了','走了','跳了','练了','运动','力量','瑜伽','健身','出汗','拉伸'],
    emotion:['感觉','心情','开心','焦虑','平静','烦躁','情绪','状态','难过','兴奋'],
    diet:['吃了','喝了','早餐','午餐','晚餐','加餐','水果','零食','咖啡','饮'],
    photo:['拍了','相机','镜头','快门','光圈','街拍','人像','构图','调色','摄影'],
    think:['想了','复盘','决定','判断','认为','反思','方向','目标','纠结','思考'],
    diary:['发生','经历','今天','昨天','早上','下午','晚上']
  };
  var target = 'diary';
  for(var mod in modules){
    for(var i=0;i<modules[mod].length;i++){
      if(text.indexOf(modules[mod][i]) !== -1){ target = mod; break; }
    }
    if(target !== 'diary') break;
  }
  var record = { id: genId(), content: text, date: TODAY, created: new Date().toISOString() };
  if(!Array.isArray(dataCache[target])) dataCache[target] = [];
  dataCache[target].push(record);
  apiSave(target, dataCache[target]);
  var names = {finance:'财务',sleep:'睡眠',exercise:'锻炼',emotion:'情绪',diet:'饮食',photo:'摄影',think:'认知思考',diary:'日记'};
  return '✅ 已存入「' + (names[target] || target) + '」';
}

function getFormConfig(sceneId){
  if(MODAL_FORMS[sceneId]) return MODAL_FORMS[sceneId];
  return null;
}

function renderFormHtml(sceneId, item){
  var config = getFormConfig(sceneId);
  if(!config) return null;
  var html = '';
  config.fields.forEach(function(f){
    var val = item ? (item[f.key] || '') : '';
    if(f.type === 'date' && !val) val = TODAY;
    html += '<label>'+f.label+'</label>';
    if(f.type === 'select'){
      html += '<select id="f_'+f.key+'">';
      html += '<option value="">请选择</option>';
      f.options.forEach(function(opt){
        var v = String(opt);
        var selected = String(val) === v ? ' selected' : '';
        html += '<option value="'+opt+'"'+selected+'>'+opt+'</option>';
      });
      html += '</select>';
    } else if(f.type === 'textarea'){
      html += '<textarea id="f_'+f.key+'" rows="3" placeholder="'+(f.placeholder||'')+'">'+val+'</textarea>';
    } else {
      html += '<input id="f_'+f.key+'" type="'+f.type+'" placeholder="'+(f.placeholder||'')+'" value="'+val+'">';
    }
  });
  return html;
}

function readFormData(sceneId){
  var config = getFormConfig(sceneId);
  var data = {};
  if(!config){
    data.content = document.getElementById('f_c').value.trim();
    data.date = document.getElementById('f_d').value;
    data.rating = document.getElementById('f_r').value;
    data.note = document.getElementById('f_n').value;
    return data;
  }
  config.fields.forEach(function(f){
    var el = document.getElementById('f_'+f.key);
    if(el) data[f.key] = el.value;
  });
  return data;
}

async function saveRecord(){
  var config = getFormConfig(curScene);
  var formData = readFormData(curScene);
  if(!config){
    var c = formData.content;
    if(!c){ alert('请填写内容'); return; }
  } else {
    var required = config.fields.find(function(f){ return f.key === 'content' || f.key === 'amount' || f.key === 'hours'; });
    if(required && !formData[required.key]){ alert('请填写'+required.label); return; }
  }
  var data=Array.isArray(dataCache[curScene])?dataCache[curScene]:(dataCache[curScene]=[]);
  if(editId){
    var item=data.find(function(x){ return String(x.id)===String(editId); });
    if(item){ Object.assign(item, formData); }
    await apiSave(curScene,data);
  } else {
    var newItem = Object.assign({id:genId(), created:new Date().toISOString()}, formData);
    data.push(newItem);
    await apiSave(curScene,data);
  }
  closeModal();
  renderDetail(curScene);
  renderHome();
}

async function delRec(sceneId,id){
  if(!confirm('确定删除？')) return;
  var data=Array.isArray(dataCache[sceneId])?dataCache[sceneId]:[];
  dataCache[sceneId]=data.filter(function(x){ return String(x.id)!==String(id); });
  await apiSave(sceneId,dataCache[sceneId]);
  renderDetail(sceneId);
  renderHome();
}

    html += '<div style="font-weight:600;font-size:14px;margin-bottom:8px">🔗 关联分析</div>';
    insightsCache.correlations.forEach(function(c){ html += '<div class="corr-item"><div class="title">'+c.title+'</div><div class="detail">'+c.detail+'</div></div>'; });
    html += '</div>';
  }
  if(insightsCache.suggestions && insightsCache.suggestions.length>0){
    html += '<div style="background:rgba(251,191,36,0.04);border-radius:12px;padding:14px;margin-bottom:12px;border-left:3px solid #FBBF24">';
    html += '<div style="font-weight:600;font-size:14px;margin-bottom:8px">💡 个性化建议</div>';
    insightsCache.suggestions.forEach(function(s){
      html += '<div style="font-size:13px;color:#E2E8F0;padding:4px 0">• '+s.text+'</div>';
    });
    html += '</div>';
  }
  if(insightsCache.monthly && insightsCache.monthly.mood){
    var m = insightsCache.monthly;
    html += '<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:14px;margin-bottom:12px">';
    html += '<div style="font-weight:600;font-size:14px;margin-bottom:4px">📅 月度总结</div>';
    html += '<div style="font-size:13px;color:#94A3B8">情绪 '+m.mood+' 分 · 记录 '+m.days+' 天</div>';
    if(m.changeText) html += '<div style="font-size:13px;color:'+(m.change>0.3?'#22C55E':m.change<-0.3?'#EF4444':'#94A3B8')+'">'+m.changeText+'</div>';
    html += '</div>';
  }
  if(!html) html = '<div class="empty"><span class="ic">📭</span>继续记录，系统会生成洞察</div>';
  c.innerHTML = html;
}

// ============================================================
// 闪念笔记 JS
// ============================================================
async function submitQuickNote() {
  var input = document.getElementById('quickNoteInput');
  var text = input.value.trim();
  if (!text) { alert('请写下你的想法'); return; }
  try {
    var res = await fetch('/api/quick-note', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text })
    });
    var data = await res.json();
    if (data.success) {
      document.getElementById('quickNoteFeedback').textContent = data.message;
      input.value = '';
      setTimeout(function() { document.getElementById('quickNoteFeedback').textContent = ''; }, 5000);
    } else {
      alert('保存失败：' + data.message);
    }
  } catch(e) { alert('网络错误'); }
}

function showQuickNotes() {
  fetch('/api/quick-notes')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var notes = data.slice(0, 15);
      var msg = '📋 闪念笔记（最近15条）：\n\n';
      notes.forEach(function(n) {
        var status = n.classified ? '✅ 已归类' : '💡 建议归入「' + (n.suggestedName || n.suggestedModule) + '」';
        msg += '📝 ' + n.content + '\n' + status + '\n\n';
      });
      alert(msg);
    })
    .catch(function(e) { alert('加载失败'); });
}

// ============================================================
// 缴费管理 JS
// ============================================================
async function loadBills() {
  try {
    var res = await fetch('/api/bills');
    var bills = await res.json();
    var container = document.getElementById('billsList');
    var unpaid = bills.filter(function(b) { return !b.paid; });
    if (unpaid.length === 0) {
      container.innerHTML = '<span style="color:#22C55E;">✅ 暂无待缴费账单</span>';
      return;
    }
    container.innerHTML = unpaid.slice(0, 5).map(function(b) {
      var statusText = b.status === 'overdue' ? '🔴 已过期' : (b.status === 'upcoming' ? '🟡 即将到期' : '⚪');
      var daysText = b.daysRemaining < 0 ? '已过期' + Math.abs(b.daysRemaining) + '天' : '剩余' + b.daysRemaining + '天';
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);"><span style="color:' + (b.status === 'overdue' ? '#EF4444' : b.status === 'upcoming' ? '#FBBF24' : '#CBD5E1') + '">' + b.name + ' ¥' + b.amount + '</span><span style="font-size:11px;color:#64748B;">' + daysText + '</span></div>';
    }).join('');
  } catch(e) { document.getElementById('billsList').textContent = '加载失败'; }
}

function openAddBill() {
  var name = prompt('📝 账单名称（如：电费）：');
  if (!name) return;
  var amount = prompt('💰 金额（元）：');
  if (!amount || isNaN(amount)) return;
  var dueDate = prompt('📅 到期日期（格式：YYYY-MM-DD）：');
  if (!dueDate) return;
  fetch('/api/bill', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, amount: parseFloat(amount), dueDate: dueDate, period: '每月', category: '生活' })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) { alert('✅ 账单已添加'); loadBills(); }
    else alert('添加失败：' + data.message);
  })
  .catch(function(e) { alert('网络错误'); });
}

// ============================================================
// 阅读打卡 JS
// ============================================================
async function loadReading() {
  try {
    var stats = await fetch('/api/reading/stats').then(function(r) { return r.json(); });
    var readings = await fetch('/api/readings').then(function(r) { return r.json(); });
    document.getElementById('readingStats').innerHTML =
      '<span>📅 本月 ' + stats.monthDays + ' 天</span><span>📚 ' + stats.totalBooks + ' 本书</span><span>📖 ' + stats.totalReadings + ' 次</span>';
    var today = new Date().toISOString().split('T')[0];
    var todayReading = readings.find(function(r) { return r.date === today; });
    document.getElementById('readingToday').textContent = todayReading
      ? '📖 今日已读《' + todayReading.bookName + '》' + (todayReading.progress || 0) + '%'
      : '⏰ 今天还没阅读，去读一会儿吧';
  } catch(e) { console.warn('阅读加载失败', e); }
}

function openAddReading() {
  var bookName = prompt('📚 书名：');
  if (!bookName) return;
  var author = prompt('✍️ 作者（可选）：') || '';
  var progress = prompt('📊 进度（%）：') || 0;
  fetch('/api/reading', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bookName: bookName, author: author, progress: parseInt(progress) || 0, date: new Date().toISOString().split('T')[0] })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) { alert('✅ 阅读打卡成功'); loadReading(); }
    else alert('添加失败：' + data.message);
  })
  .catch(function(e) { alert('网络错误'); });
}

// ============================================================
// 家务引擎 JS
// ============================================================
async function loadHousework() {
  try {
    var res = await fetch('/api/housework');
    var data = await res.json();
    var modeNames = { normal: '正常', busy: '🔴 忙', rest: '🟢 闲' };
    document.getElementById('houseworkModeBadge').textContent = modeNames[data.mode] || '正常';
    var urgent = data.urgent || [];
    var html = '';
    if (urgent.length > 0) {
      html += '<div style="color:#EF4444;font-size:11px;margin-bottom:4px;">⚠️ 逾期任务</div>';
      urgent.slice(0, 3).forEach(function(t) {
        html += '<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03);"><span style="color:#EF4444;">' + t.task + '</span><button onclick="completeHousework(\'' + t.id + '\')" style="background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:0 8px;color:#94A3B8;font-size:10px;cursor:pointer;">完成</button></div>';
      });
    } else if (data.mode !== 'busy') {
      html += '<div style="color:#22C55E;font-size:12px;">✅ 今日所有任务已完成</div>';
    } else {
      html += '<div style="color:#94A3B8;font-size:12px;">📌 忙模式：只显示紧急任务</div>';
    }
    document.getElementById('houseworkList').innerHTML = html || '<span style="color:#64748B;font-size:12px;">暂无待做任务</span>';
  } catch(e) { document.getElementById('houseworkList').textContent = '加载失败'; }
}

function completeHousework(id) {
  if (!confirm('确认已完成？')) return;
  fetch('/api/housework/complete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ taskId: id })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) { if (data.success) { alert(data.message); loadHousework(); } })
  .catch(function(e) { alert('网络错误'); });
}

function switchHouseworkMode() {
  var modes = ['normal', 'busy', 'rest'];
  var labels = ['正常', '忙（只做紧急）', '闲（全部做）'];
  var choice = prompt('选择模式：\n1. 正常\n2. 忙（只做紧急任务）\n3. 闲（全部任务）', '1');
  if (!choice) return;
  var idx = parseInt(choice) - 1;
  if (idx < 0 || idx > 2) return;
  fetch('/api/housework/mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: modes[idx] })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) { if (data.success) { alert(data.message); loadHousework(); } })
  .catch(function(e) { alert('网络错误'); });
}

// ============================================================
// 社交人脉 JS
// ============================================================
async function loadSocial() {
  try {
    var res = await fetch('/api/contacts');
    var contacts = await res.json();
    var container = document.getElementById('socialList');
    if (contacts.length === 0) {
      container.innerHTML = '<span style="color:#64748B;font-size:12px;">还没有联系人，点 + 添加</span>';
      return;
    }
    var top = contacts.slice(0, 3);
    container.innerHTML = top.map(function(c) {
      var badge = '';
      if (c.daysUntilBirthday !== null && c.daysUntilBirthday <= 7) badge = '🎂 ';
      if (c.daysSinceContact !== null && c.daysSinceContact > 30) badge = '📅 ';
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);"><span style="color:#CBD5E1;">' + badge + c.name + '</span><span style="font-size:11px;color:#64748B;">' + c.relation + '</span></div>';
    }).join('');
  } catch(e) { document.getElementById('socialList').textContent = '加载失败'; }
}

function openAddContact() {
  var name = prompt('👤 姓名：');
  if (!name) return;
  var relation = prompt('📌 关系（家人/朋友/同事）：') || '朋友';
  var birthday = prompt('🎂 生日（格式：YYYY-MM-DD，可选）：') || '';
  fetch('/api/contact', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, relation: relation, birthday: birthday, phone: '', note: '' })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) { if (data.success) { alert('✅ 联系人已添加'); loadSocial(); } })
  .catch(function(e) { alert('网络错误'); });
}

// 成就系统 JS
// ============================================================
async function loadAchievements() {
  try {
    var res = await fetch('/api/achievements');
    var data = await res.json();
    var container = document.getElementById('achievementList');
    if (data.unlockedCount === 0) {
      container.innerHTML = '<span style="color:#64748B;font-size:12px;">继续努力，解锁第一个成就 🏆</span>';
      return;
    }
    container.innerHTML = data.unlocked.slice(0, 4).map(function(a) {
      return '<span style="background:rgba(167,139,250,0.1);border-radius:12px;padding:2px 10px;font-size:11px;color:#A78BFA;">' + a.name + '</span>';
    }).join('');
  } catch(e) { document.getElementById('achievementList').textContent = '加载失败'; }
  try { await fetch('/api/achievements/check', { method: 'POST' }); } catch(e) {}
}

function viewAchievements() {
  fetch('/api/achievements')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var msg = '🏆 成就墙\n\n已解锁 ' + data.unlockedCount + '/' + data.total + '\n\n';
      data.all.forEach(function(a) {
        msg += (a.unlocked ? '✅ ' : '🔒 ') + a.name + ' — ' + a.condition + '\n';
      });
      alert(msg);
    })
    .catch(function(e) { alert('加载失败'); });
}
